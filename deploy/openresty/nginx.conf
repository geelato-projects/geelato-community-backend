# ============================================================================
# 灰度发布 OpenResty 路由配置
# ----------------------------------------------------------------------------
# 职责：纯路由。读浏览器 Cookie 中的 gl_traffic_tag（裸值，未签名），
#       值为 gray 时转发到【新后端】，否则转发到【老后端】。
#       不查 Redis、不维护规则，规则由后端 SpringBoot 写 Cookie 决定。
#
# 固有特性：首次无 Cookie 的请求默认走老后端；老后端计算出 tag=gray 后写
#       裸 Cookie 回浏览器，下一次请求本网关才会路由到新后端。
#
# Cookie 格式（signing-enabled=false 时由后端写入）：gl_traffic_tag=gray
# ============================================================================

worker_processes  auto;

events {
    worker_connections  1024;
}

http {

    # ---------- 后端 upstream ----------
    upstream backend_old {
        # 老 SpringBoot（默认流量）
        server 127.0.0.1:8081 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream backend_new {
        # 新 SpringBoot（灰度流量）
        server 127.0.0.1:8082 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen       80;
        server_name  _;

        client_max_body_size  50m;

        # ----------------------------------------------------------------------
        # 灰度路由：根据 gl_traffic_tag Cookie 选择 upstream
        # ----------------------------------------------------------------------
        location / {
            access_by_lua_block {
                local tag = "default"
                local cookie = ngx.var.http_cookie
                if cookie then
                    -- 匹配 gl_traffic_tag=xxx（取第一个等号到分号或行尾之间的值）
                    local m = ngx.re.match(cookie, [[gl_traffic_tag=([^;\s]+)]], "jo")
                    if m and m[1] then
                        tag = m[1]
                    end
                end

                -- 值为 gray 走新后端，其余（default / 空 / 异常）均走老后端
                if tag == "gray" then
                    ngx.var.upstream_name = "backend_new"
                else
                    ngx.var.upstream_name = "backend_old"
                    tag = "default"  -- 归一化，便于透传与日志统计
                end

                -- 透传标签给后端（后端亦有自己的识别，此处便于后端日志/MDC 对齐）
                ngx.req.set_header("X-Gl-Traffic-Tag", tag)
            }

            proxy_pass http://$upstream_name;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";

            # 后端 Set-Cookie 原样透传回浏览器，无需额外处理
            proxy_pass_header Set-Cookie;

            proxy_connect_timeout 5s;
            proxy_read_timeout    60s;
            proxy_send_timeout    60s;
        }
    }
}
