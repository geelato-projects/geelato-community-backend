# geelato-platform 告警规则（SRE 黄金信号：Latency / Traffic / Errors / Saturation）
#
# 阈值依据：参考 Google SRE 建议（错误预算、饱和度、延迟目标），结合平台典型负载设定。
# 所有规则假定 scrape_interval=30s、公共标签 application/module 已注入。
# severity: critical（需立即介入）/ warning（需关注，可能演变为 critical）
#
# 告警状态查询：Prometheus UI → Alerts

groups:
  - name: geelato-platform.golden-signals
    interval: 30s
    rules:

      # ===== Errors：API 错误率 =====
      # 5xx 错误占比超过 5%（5 分钟窗口）
      - alert: PlatformApiHighErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) by (application)
          /
          clamp_min(sum(rate(http_server_requests_seconds_count[5m])) by (application), 1)
          > 0.05
        for: 5m
        labels:
          severity: critical
          signal: errors
        annotations:
          summary: "平台 API 5xx 错误率过高 ({{ $labels.application }})"
          description: "5 分钟平均 5xx 错误占比 {{ $value | humanizePercentage }}，超过阈值 5%。可能存在服务端异常或下游不可用。"

      # ===== Latency：API 延迟 =====
      # p95 延迟超过 1 秒（5 分钟窗口）
      - alert: PlatformApiHighLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum(rate(http_server_requests_seconds_bucket[5m])) by (le, application))
          > 1
        for: 10m
        labels:
          severity: warning
          signal: latency
        annotations:
          summary: "平台 API p95 延迟过高 ({{ $labels.application }})"
          description: "近 10 分钟 p95 延迟 {{ $value }}s 超过 1s SLO。可能原因：DB 慢查询、连接池耗尽、GC 抖动。"

      # ===== Saturation：数据库连接池饱和 =====
      # 活跃连接 / 最大连接 > 80%（5 分钟），接近池耗尽
      - alert: PlatformDbPoolSaturation
        expr: |
          hikaricp_connections_active
          / clamp_min(hikaricp_connections_max, 1)
          > 0.8
        for: 5m
        labels:
          severity: critical
          signal: saturation
        annotations:
          summary: "数据库连接池饱和 ({{ $labels.pool }})"
          description: "HikariCP 连接池 {{ $labels.pool }} 活跃连接占比 {{ $value | humanizePercentage }} 超过 80%，持续 5 分钟。即将耗尽，请求将排队等待。"

      # ===== Saturation：JVM 堆内存 =====
      # 堆使用率 > 85%（10 分钟），接近 OOM
      - alert: PlatformJvmHighHeap
        expr: |
          sum(jvm_memory_used_bytes{area="heap"})
          / clamp_min(sum(jvm_memory_max_bytes{area="heap"}), 1)
          > 0.85
        for: 10m
        labels:
          severity: warning
          signal: saturation
        annotations:
          summary: "JVM 堆内存使用率过高 ({{ $labels.application }})"
          description: "堆内存使用 {{ $value | humanizePercentage }} 超过 85%，持续 10 分钟。可能触发频繁 Full GC 甚至 OOM。"

      # ===== 健康状态 =====
      # 平台 platformHealth 指标非 UP。
      # Spring Boot 把 HealthIndicator 的状态暴露为名为 "health" 的 Gauge：
      #   health{health="<beanName>"} = Status 的数字编码（1=UP, 2=OUT_OF_SERVICE, 3=DOWN, 0=UNKNOWN, 自定义 DEGRAGED 另编码）。
      # 平台 platformHealth 的 bean 名为 "platformHealth"，UP 时值为 1；非 1 即降级/异常。
      - alert: PlatformHealthDegraded
        expr: health{health="platformHealth"} != 1
        for: 2m
        labels:
          severity: warning
          signal: health
        annotations:
          summary: "平台健康状态降级 ({{ $labels.application }})"
          description: "platformHealth 指标显示非 UP 状态，存在异常模块。检查 /actuator/health 的 modules 详情定位具体模块。"

  - name: geelato-platform.availability
    interval: 30s
    rules:

      # ===== 实例存活 =====
      # scrape 失败超过 1 分钟（实例宕机或网络不通）
      - alert: PlatformInstanceDown
        expr: up{job="geelato-platform"} == 0
        for: 1m
        labels:
          severity: critical
          signal: availability
        annotations:
          summary: "平台实例不可达 ({{ $labels.instance }})"
          description: "Prometheus 连续 1 分钟无法抓取 {{ $labels.instance }} 的 /actuator/prometheus。实例可能已宕机或网络隔离。"

      # ===== 连接池配置异常 =====
      # max 连接为 0 或缺失（配置错误，活跃连接会被无限拒绝）
      - alert: PlatformDbPoolMaxZero
        expr: hikaricp_connections_max == 0
        for: 5m
        labels:
          severity: warning
          signal: saturation
        annotations:
          summary: "数据库连接池 max 配置为 0 ({{ $labels.pool }})"
          description: "HikariCP 连接池 {{ $labels.pool }} 的 maximumPoolSize 为 0，所有请求将无法获取连接。"
