# geelato Prometheus 抓取配置（统一配置文件）
# 使用方式：prometheus --config.file=prometheus.yml --web.enable-lifecycle
# 告警规则：同目录 alerts.yml（rule_files 已引用）
#
# 端点均为 /actuator/prometheus（Spring Boot Actuator + Micrometer OpenMetrics 格式）
#
# 抓取目标：
#   - geelato-platform ：平台服务，manage.geelato.cn（HTTPS）  ← 最终统一入口
#   - geelato-message  ：消息中心，message.ocean-bridges.com（HTTPS）
#
# 指标命名映射（Micrometer → Prometheus）：
#   platform: http_server_requests_seconds_* / hikaricp_connections_* / jvm_memory_used_bytes / process_cpu_usage / health
#   message:  geelato_message_enqueue_total / geelato_message_dispatch_duration_seconds_bucket / geelato_message_queue_backlog ...
# 公共标签：application、module；message 可配 tenant（默认关闭）

global:
  # 抓取间隔 30s：
  #   - platform：HTTP/连接池/JVM 指标变化平缓，30s 足够
  #   - message ：与 geelato.message.monitoring.snapshot-interval(30s) 粒度对齐
  # 流量约为 15s 间隔的一半（见 README 测算方法）
  scrape_interval: 30s
  evaluation_interval: 15s
  # 抓取超时与外部标签按需调整
  # external_labels:
  #   cluster: prod

# 告警规则暂未启用。需要时取消下方注释即可加载同目录 alerts.yml（平台黄金信号 + 消息业务告警）。
# rule_files:
#   - alerts.yml

scrape_configs:

  # ==================== 平台服务（最终统一入口） ====================
  - job_name: geelato-platform
    metrics_path: /actuator/prometheus
    scheme: https
    # 生产地址：https://manage.geelato.cn/actuator/prometheus（443 端口）
    # 本地联调可改为 localhost:8080 + scheme: http
    static_configs:
      - targets: ["manage.geelato.cn:443"]
        labels:
          env: prod
          service: platform

  # ==================== 消息中心 ====================
  - job_name: geelato-message
    metrics_path: /actuator/prometheus
    scheme: https
    # 生产环境实际地址（https://message.ocean-bridges.com/actuator/prometheus，443 端口）
    # 本地联调可改为 localhost:8086 + scheme: http
    static_configs:
      - targets: ["message.ocean-bridges.com:443"]
        labels:
          env: prod
          service: message

