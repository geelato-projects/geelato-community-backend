server.port=8080
geelato.web=${GEELATO_WEB_OPTION:true}
geelato.schedule=${GEELATO_SCHEDULE_OPTION:false}

geelato.datasource.dynamic.enable-jta-transaction=false
geelato.datasource.dynamic.enable-seata-proxy=false
geelato.datasource.dynamic.catalog-mapping.platform=primary
geelato.datasource.dynamic.catalog-mapping.ob_integrate=7533331659102490624
geelato.datasource.dynamic.catalog-mapping.platform-log=5536568115917361152
#plugin
geelato.plugin.pluginDirectory=${GEELATO_PLUGIN_DIRECTORY}
geelato.plugin.pluginRepository=${GEELATO_PLUGIN_REPOSITORY:}
# \u63D2\u4EF6\u5F00\u5173\u914D\u7F6E\u76EE\u5F55\uFF08\u5171\u4EAB\u5377\u6302\u8F7D\u70B9\uFF0C\u591A\u8282\u70B9\u90E8\u7F72\u9700\u6307\u5411\u540C\u4E00\u5171\u4EAB\u8DEF\u5F84\uFF09
geelato.plugin.config-directory=${GEELATO_PLUGIN_CONFIG_DIR:plugins-config}
# \u5F00\u5173\u672C\u5730\u7F13\u5B58\u65F6\u957F\uFF08\u79D2\uFF09
geelato.plugin.cache-ttl-seconds=${GEELATO_PLUGIN_CACHE_TTL:5}
# \u63D2\u4EF6\u6269\u5C55\u65B9\u6CD5\u8C03\u7528\u8D85\u65F6\uFF08\u6BEB\u79D2\uFF0C0=\u4E0D\u9650\u5236\uFF09
geelato.plugin.invocation-timeout-millis=${GEELATO_PLUGIN_INVOCATION_TIMEOUT:60000}
# \u662F\u5426\u6821\u9A8C\u63D2\u4EF6 jar \u7B7E\u540D\uFF08\u9ED8\u8BA4\u5173\u95ED\uFF09
geelato.plugin.signature-verify=${GEELATO_PLUGIN_SIG_VERIFY:false}

#### DB ####
spring.datasource.primary.name=primary
spring.datasource.primary.jdbc-url=${GEELATO_PRIMARY_JDBCURL:jdbc:mysql://localhost:3306/geelato?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowMultiQueries=true&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true&connectTimeout=10000&socketTimeout=300000}
spring.datasource.primary.username=${GEELATO_PRIMARY_JDBCUSER:geelato_user}
spring.datasource.primary.password=${GEELATO_PRIMARY_JDBCPASSWORD:geelato@psd}
spring.datasource.primary.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.primary.maximum-pool-size=${GEELATO_PRIMARY_MAX_POOL_SIZE:20}
spring.datasource.primary.minimum-idle=${GEELATO_PRIMARY_MIN_POOL_SIZE:5}
spring.datasource.primary.connection-timeout=5000
spring.datasource.primary.validation-timeout=3000
spring.datasource.primary.keepalive-time=300000
spring.datasource.primary.max-lifetime=1200000
spring.datasource.primary.connection-test-query=SELECT 1
spring.datasource.primary.leak-detection-threshold=60000

# \u6700\u7EC8\u6267\u884C SQL \u65E5\u5FD7\uFF08p6spy \u88C5\u9970\u6240\u6709 DataSource\uFF0C\u542B\u52A8\u6001\u8DEF\u7531\u6570\u636E\u6E90\uFF09\uFF1A\u8F93\u51FA\u53C2\u6570\u56DE\u586B\u540E\u7684\u6700\u7EC8 SQL + \u6267\u884C\u8017\u65F6\uFF0C\u8986\u76D6 MQL/DSL/\u5B9E\u4F53/\u539F\u751F SQL/\u811A\u672C\u5168\u90E8\u8DEF\u5F84
# \u65E5\u5FD7\u7ECF\u7531 logger \u540D p6spy \u8F93\u51FA\u5230\u63A7\u5236\u53F0\u4E0E ${LOG_DIR}/sql/\uFF08\u89C1 geelato-logback.xml\uFF09\uFF1B\u9700\u8981\u9759\u9ED8\u65F6\u8BBE GEELATO_SQL_LOG_ENABLED=false
decorator.datasource.p6spy.enable-logging=${GEELATO_SQL_LOG_ENABLED:true}
decorator.datasource.p6spy.logging=slf4j
decorator.datasource.p6spy.multiline=true

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB


#### LOG ####
logging.config=${GEELATO_LOGBACK_CONFIG:classpath:geelato-logback.xml}
logging.level.root=INFO
logging.level.cn.geelato=info
logging.level.org.apache.shiro=INFO
logging.level.p6spy=INFO
logging.level.com.p6spy=INFO
logging.level.org.springframework.jdbc.core=INFO
logging.pattern.console=[%-5level]%d{ss.SSS} %logger{36} %L- %m%n


geelato.meta.scan-package-names=cn.geelato
geelato.graal.scan-package-names=cn.geelato
geelato.es.debug=true
geelato.es.debug-max-length=20000
geelato.file.root.path=C:\\geelato\\files
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=2048

#### MQL Playground\uFF08\u5728\u7EBF\u8C03\u8BD5\u4E0E\u6D4B\u8BD5\u573A\u666F\u96C6\uFF09 ####
# \u5F00\u542F\u540E\u53EF\u8BBF\u95EE http://host:port/mql-playground.html
# \u7AEF\u70B9\uFF1A/api/mql/explain|execute|validate|entities|schema|scenarios
# \u653E\u884C\u8DEF\u5F84\u5DF2\u5185\u7F6E\u5728 SecurityInterceptorProperties \u9ED8\u8BA4\u6392\u9664\u4E2D\uFF0C\u65E0\u9700\u989D\u5916\u914D\u7F6E
# \u751F\u4EA7\u73AF\u5883\u5E94\u8BBE\u4E3A false
geelato.mql.playground.enabled=true

#### \u5B9E\u4F53\u4E09\u8005\u540C\u6B65\u6821\u9A8C\u5DE5\u5177 ####
# \u5F00\u542F\u540E\u53EF\u8BBF\u95EE http://host:port/meta-sync.html
# \u529F\u80FD\uFF1AJava\u7C7B/\u5B9E\u4F53\u5B9A\u4E49(platform_dev_table)/\u7269\u7406\u8868\u7ED3\u6784 \u4E09\u8005\u4E00\u81F4\u6027\u6821\u9A8C\u4E0E\u8865\u507F
# \u7AEF\u70B9\uFF1A/api/meta-sync/scan|diff|entities|fix/*
# \u653E\u884C\u8DEF\u5F84\u5DF2\u5185\u7F6E\u5728 SecurityInterceptorProperties \u9ED8\u8BA4\u6392\u9664\u4E2D
# \u751F\u4EA7\u73AF\u5883\u5E94\u8BBE\u4E3A false
geelato.meta.sync.enabled=true

#### \u7AD9\u5185\u4FE1\u901A\u77E5 ####
# \u901A\u77E5 outbox \u6295\u9012\u8C03\u5EA6\uFF1A\u9ED8\u8BA4\u5173\u95ED\uFF0C\u672C\u5E94\u7528\u627F\u62C5\u901A\u77E5\u5E93\u6295\u9012\u804C\u8D23\u65F6\u7F6E true\u3002
# \u5E73\u53F0\u81EA\u8EAB/\u72EC\u7ACB\u901A\u77E5\u5E93\u7684\u5E94\u7528\u987B\u7F6E true\uFF0C\u5426\u5219\u901A\u77E5\u6EDE\u7559 outbox \u65E0\u4EBA\u6295\u9012\uFF1B
# \u4E0E\u5E73\u53F0\u5171\u7528\u901A\u77E5\u5E93\u7684\u811A\u624B\u67B6\u5E94\u7528\u4FDD\u6301\u5173\u95ED\uFF08\u6295\u9012\u5F52\u53E3\u5E73\u53F0\uFF09\uFF0C\u8BE6\u89C1 docs/notification/integration-guide.md
geelato.notification.outbox-enabled=true

