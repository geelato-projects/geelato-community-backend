spring.application.name=geelato-web-runtime
logging.level.root=INFO
logging.level.cn.geelato=INFO

# 外部系统固定令牌（SystemToken）认证：外部系统以 Authorization: SystemToken <密钥> 调用
# 标注了 @AllowSystemAccess 的接口（如 dyn 模块 POST /api/notification/send 发送站内信）。
# 机制默认开启且密钥有内置默认值；生产环境建议用环境变量覆盖为随机长串。
# geelato.security.system-token.token=${GEELATO_SYSTEM_TOKEN}
